<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f8f5">
    <meta name="description" content="具备知识检索、记忆与动作分析能力的个人健身助手智能体">
    <title>FitAgent · 个人健身助手</title>
    <link rel="stylesheet" href="./styles.css?v=20260729-model-picker">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar" aria-label="应用导航">
            <div class="sidebar-header">
                <a class="brand" href="./" aria-label="FitAgent 首页">
                    <span class="brand-mark" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M7 7.5h2.2v9H7v-2H4.8v-5H7v-2Zm7.8 0H17v2h2.2v5H17v2h-2.2v-9ZM9.2 11h5.6v2H9.2v-2Z"/></svg>
                    </span>
                    <span>
                        <strong>FitAgent</strong>
                        <small>个人健身助手</small>
                    </span>
                </a>
                <button class="icon-button mobile-only" id="close-sidebar-button" type="button" aria-label="关闭导航">
                    <svg viewBox="0 0 24 24"><path d="m6.7 5.3 5.3 5.3 5.3-5.3 1.4 1.4-5.3 5.3 5.3 5.3-1.4 1.4-5.3-5.3-5.3 5.3-1.4-1.4 5.3-5.3-5.3-5.3 1.4-1.4Z"/></svg>
                </button>
            </div>

            <button class="new-chat-button" id="new-chat-button" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5Z"/></svg>
                新建对话
            </button>

            <nav class="sidebar-section" aria-label="会话">
                <p class="sidebar-label">当前会话</p>
                <button class="conversation-item active" id="current-conversation" type="button">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 3v-3a2 2 0 0 1-1-1.73V6a2 2 0 0 1 2-2Zm0 2v10h1v1.45L8.45 16H19V6H5Z"/></svg>
                    <span id="conversation-title">新的健身对话</span>
                </button>
            </nav>

            <div class="sidebar-spacer"></div>

            <section class="capability-panel" aria-label="当前能力">
                <p class="sidebar-label">当前能力</p>
                <div class="capability-row">
                    <span><i class="capability-dot"></i>知识检索</span>
                    <span><i class="capability-dot"></i>动作分析</span>
                </div>
                <div class="capability-row">
                    <span><i class="capability-dot"></i>饮食建议</span>
                    <span><i class="capability-dot"></i>长期记忆</span>
                </div>
            </section>

            <div class="service-status" id="service-status" role="status" aria-live="polite">
                <span class="status-dot checking"></span>
                <span>
                    <strong>正在连接服务</strong>
                    <small>检查后端状态</small>
                </span>
            </div>
        </aside>

        <button class="sidebar-backdrop" id="sidebar-backdrop" type="button" aria-label="关闭导航"></button>

        <main class="chat-layout">
            <header class="topbar">
                <button class="icon-button desktop-hidden" id="open-sidebar-button" type="button" aria-label="打开导航">
                    <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4V6Zm0 5h16v2H4v-2Zm0 5h16v2H4v-2Z"/></svg>
                </button>
                <div class="topbar-title">
                    <strong>个人健身助手</strong>
                    <span id="active-capability">智能路由 · 上下文记忆</span>
                </div>
                <div class="topbar-actions">
                    <span class="privacy-hint" title="会话与记忆存储在当前服务中">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4.5 5v5.5c0 4.78 3.2 9.24 7.5 10.5 4.3-1.26 7.5-5.72 7.5-10.5V5L12 2Zm0 2.16L17.5 6.3v4.2c0 3.7-2.3 7.25-5.5 8.4-3.2-1.15-5.5-4.7-5.5-8.4V6.3L12 4.16Zm-1 3.34h2v4h-2v-4Zm0 5.5h2v2h-2v-2Z"/></svg>
                        原型环境
                    </span>
                </div>
            </header>

            <section class="chat-scroll" id="chat-scroll" aria-label="对话内容">
                <div class="messages" id="messages" aria-live="polite">
                    <section class="empty-state" id="empty-state">
                        <div class="welcome-mark" aria-hidden="true">
                            <svg viewBox="0 0 24 24"><path d="M7 7.5h2.2v9H7v-2H4.8v-5H7v-2Zm7.8 0H17v2h2.2v5H17v2h-2.2v-9ZM9.2 11h5.6v2H9.2v-2Z"/></svg>
                        </div>
                        <p class="eyebrow">FITAGENT</p>
                        <h1>今天想从哪里开始？</h1>
                        <p class="welcome-copy">我可以结合健身知识、个人记忆和动作分析，给出可执行的训练与饮食建议。</p>
                        <div class="suggestion-grid" aria-label="快捷问题">
                            <button class="suggestion-card" type="button" data-prompt="帮我制定一份适合新手的每周三练计划">
                                <span class="suggestion-icon green">
                                    <svg viewBox="0 0 24 24"><path d="M7 7h2v10H7v-2H5V9h2V7Zm8 0h2v2h2v6h-2v2h-2V7Zm-6 4h6v2H9v-2Z"/></svg>
                                </span>
                                <span><strong>制定训练计划</strong><small>根据目标拆解一周安排</small></span>
                            </button>
                            <button class="suggestion-card" type="button" data-prompt="减脂期间怎么安排三餐更容易坚持？">
                                <span class="suggestion-icon amber">
                                    <svg viewBox="0 0 24 24"><path d="M5 3h2v7a2 2 0 0 0 2 2V3h2v9a4 4 0 0 1-3 3.87V21H6v-5.13A4 4 0 0 1 3 12V3h2Zm11 0c2.76 0 5 2.69 5 6 0 2.62-1.4 4.85-3.35 5.66V21h-2v-6.34C13.4 13.85 12 11.62 12 9c0-3.31 2.24-6 5-6h-1Zm1 2c-1.49 0-3 1.65-3 4s1.51 4 3 4 2-1.65 2-4-1.51-4-2-4Z"/></svg>
                                </span>
                                <span><strong>优化饮食安排</strong><small>兼顾目标、营养与习惯</small></span>
                            </button>
                            <button class="suggestion-card" type="button" data-prompt="分析深蹲时膝盖内扣可能有哪些原因，并给出改进建议">
                                <span class="suggestion-icon blue">
                                    <svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 1 3 3c0 1.31-.84 2.42-2 2.83V10h3a3 3 0 0 1 3 3v2h-2v-2a1 1 0 0 0-1-1h-3v3.17c1.16.41 2 1.52 2 2.83a3 3 0 1 1-4-2.83V12H8a1 1 0 0 0-1 1v2H5v-2a3 3 0 0 1 3-3h3V7.83A3 3 0 0 1 12 2Zm0 2a1 1 0 1 0 0 2 1 1 0 0 0 0-2Zm0 13a1 1 0 1 0 0 2 1 1 0 0 0 0-2Z"/></svg>
                                </span>
                                <span><strong>分析动作问题</strong><small>也可以上传图片或视频</small></span>
                            </button>
                            <button class="suggestion-card" type="button" data-prompt="记住我每周只能训练三次，而且右膝曾经受过伤">
                                <span class="suggestion-icon violet">
                                    <svg viewBox="0 0 24 24"><path d="M12 3a7 7 0 0 1 4.9 12l-1.4-1.42A5 5 0 1 0 12 15v-2l4 3-4 3v-2a7 7 0 0 1 0-14Zm-1 4h2v4.59l2.7 2.7-1.4 1.42-3.3-3.3V7Z"/></svg>
                                </span>
                                <span><strong>记录个人偏好</strong><small>让后续建议更贴合你</small></span>
                            </button>
                        </div>
                    </section>
                </div>
            </section>

            <footer class="composer-zone">
                <div class="attachment-preview" id="attachment-preview" hidden>
                    <span class="file-icon">
                        <svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7V3Zm2 2v14h8V9h-4V5H9Zm6 .83V7h1.17L15 5.83Z"/></svg>
                    </span>
                    <span><strong id="attachment-name"></strong><small id="attachment-detail"></small></span>
                    <button class="icon-button" id="remove-attachment-button" type="button" aria-label="移除附件">
                        <svg viewBox="0 0 24 24"><path d="m6.7 5.3 5.3 5.3 5.3-5.3 1.4 1.4-5.3 5.3 5.3 5.3-1.4 1.4-5.3-5.3-5.3 5.3-1.4-1.4 5.3-5.3-5.3-5.3 1.4-1.4Z"/></svg>
                    </button>
                </div>
                <div class="composer">
                    <input id="media-input" type="file" accept="image/png,image/jpeg,video/mp4,video/quicktime,video/x-msvideo" hidden>
                    <button class="composer-tool" id="attach-button" type="button" title="上传动作图片或视频" aria-label="上传动作图片或视频">
                        <svg viewBox="0 0 24 24"><path d="M8.5 12.5 14.8 6.2a3 3 0 1 1 4.24 4.24l-7.78 7.78a5 5 0 0 1-7.07-7.07l7.42-7.42 1.42 1.42-7.43 7.42a3 3 0 0 0 4.25 4.24l7.78-7.78a1 1 0 0 0-1.42-1.41L9.92 13.9a1 1 0 1 0 1.42 1.42l5.58-5.59 1.42 1.42-5.59 5.58a3 3 0 1 1-4.24-4.24Z"/></svg>
                    </button>
                    <textarea id="user-input" rows="1" maxlength="4096" placeholder="询问训练、饮食或上传动作素材…" aria-label="输入消息"></textarea>
                    <label class="model-picker" for="model-select">
                        <span class="sr-only">选择对话模型</span>
                        <select id="model-select" aria-label="选择对话模型">
                            <option value="">正在加载模型…</option>
                        </select>
                    </label>
                    <button class="send-button" id="send-button" type="button" aria-label="发送消息">
                        <svg class="send-icon" viewBox="0 0 24 24"><path d="m4 12 16-8-5.8 16-3.35-6.85L4 12Zm5.55-.05 3.5 1.7 1.7 3.5L17 7l-7.45 4.95Z"/></svg>
                        <svg class="stop-icon" viewBox="0 0 24 24"><path d="M7 7h10v10H7V7Z"/></svg>
                    </button>
                </div>
                <p class="composer-hint"><kbd>Enter</kbd> 发送 · <kbd>Shift</kbd> + <kbd>Enter</kbd> 换行 · 生成内容仅供健身参考</p>
            </footer>
        </main>
    </div>

    <div class="toast-region" id="toast-region" aria-live="assertive"></div>
    <script src="./app.js?v=20260729-model-picker" defer></script>
</body>
</html>
