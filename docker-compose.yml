services:
  fitness-assistant:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - D:/Users/Agent/model/models/Qwen/Qwen3-0___6B:/models/Qwen3-0.6B:ro
    environment:
      - MODEL_PATH=/models/Qwen3-0.6B
      - MODEL_DEVICE=cpu
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - RETRIEVER_BACKEND=${RETRIEVER_BACKEND:-sqlite_faiss}
      - RETRIEVER_DB_PATH=${RETRIEVER_DB_PATH:-/app/data/rag/knowledge.db}
      - RETRIEVER_TIMEOUT_SECONDS=${RETRIEVER_TIMEOUT_SECONDS:-3}
      - RETRIEVER_FALLBACK_TO_MEMORY=${RETRIEVER_FALLBACK_TO_MEMORY:-true}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      - MEMORY_VECTOR_ENABLED=${MEMORY_VECTOR_ENABLED:-false}
      - MEMORY_VECTOR_DB_PATH=${MEMORY_VECTOR_DB_PATH:-/app/data/memory/memory_vectors.db}
    restart: unless-stopped
